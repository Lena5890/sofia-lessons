<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light">
<title>Sofia · English lessons</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%92%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--cream:#FFF8F2;--pink:#F4728F;--pink-light:#FFD6E0;--rose:#C8365A;--text:#2B1018;--text-soft:#6B4455;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:Arial,sans-serif;color:var(--text);
  background-color:var(--pink-light);background-image:repeating-conic-gradient(var(--pink-light) 0% 25%,#fff 0% 50%);background-size:56px 56px;}
.card{max-width:460px;width:100%;background:var(--cream);border:2.5px solid var(--rose);border-radius:24px;padding:36px 32px;text-align:center;}
.e{font-size:40px;margin-bottom:10px;}
h1{font-family:Georgia,serif;font-size:32px;line-height:1.15;margin-bottom:10px;}
h1 em{color:var(--rose);}
p{color:var(--text-soft);line-height:1.6;font-size:15px;}
</style>
</head>
<body>
  <main class="card">
    <div class="e">🍒</div>
    <h1>Sofia · <em>English</em></h1>
    <p>Interactive lessons. Please use the link to your lesson that Sofia sent you.</p>
  </main>
</body>
</html>
